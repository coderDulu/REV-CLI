appId: freq-config
productName: 可配置用频上位机软件
directories:
  buildResources: build
  output: out/freq-config
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - "!nodemon.json"
  - "!rollup.config.js"
  - "!.rollup.cache"
  - "!server/*"
  - "!out/*"
asar: true
asarUnpack:
  - resources/*
win:
  icon: ./build/favicon.ico
  executableName: 可配置用频上位机软件 # 确保安装后的可执行文件名称正确
nsis:
  artifactName: 可配置用频上位机软件-${version}-setup.${ext}
  shortcutName: 可配置用频上位机软件
  uninstallDisplayName: 可配置用频上位机软件
  createDesktopShortcut: always
dmg:
  artifactName: 可配置用频上位机软件-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
