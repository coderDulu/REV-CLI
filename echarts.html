<!DOCTYPE html>
<html style="height: 100%">
<head>
  <meta charset="UTF-8">
  <title>ECharts</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body style="height: 100%; margin: 0">
  <div id="main" style="height: 100%"></div>
  <script type="text/javascript">
    // 初始化图表
    var chartDom = document.getElementById('main');
    var myChart = echarts.init(chartDom);
    var option;

    // 数据数组
    var data = [];
    var timeData = [];

    // 第一个数据点的时间
    var startTime = null;

    // 获取当前时间的秒数
    function getCurrentSecond() {
      return Date.now() / 1000; // 返回当前时间的秒数
    }

    // 初始化图表配置
    option = {
      title: {
        text: '网络传输速率图表'
      },
      tooltip: {
        trigger: 'axis',
        formatter: function (params) {
          var time = params[0].name;
          var value = params[0].value;
          return `相对时间: ${time} 秒<br>速率: ${value} Byte/s`;
        }
      },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: timeData,
        name: '时间 (秒)', // x 轴名称
      },
      yAxis: {
        type: 'value',
        name: '速率 (Byte/s)', // y 轴名称
        min: 0,              // 固定最小值为 0
        max: 70000,          // 固定最大值为 70K (70000 Byte/s)
        axisLabel: {
          formatter: function (value) {
            return value + ' Byte/s';
          }
        }
      },
      series: [
        {
          name: '传输速率',
          type: 'line',
          data: data,
          smooth: true, // 平滑曲线
        }
      ]
    };

    myChart.setOption(option);

    // 模拟动态数据增加
    setInterval(function () {
      const currentTime = getCurrentSecond(); // 当前时间秒数
      const newData = Math.random() * 70000; // 随机生成数据，范围 0 至 70K Byte/s

      // 如果这是第一次添加数据，则记录起始时间
      if (!startTime) {
        startTime = currentTime;
      }

      // 计算相对时间，作为 x 轴的刻度
      const relativeTime = currentTime - startTime;

      // 动态增加数据
      if (timeData.length >= 10) {
        timeData.shift(); // 删除最早的数据
        data.shift();
      }

      timeData.push(relativeTime.toFixed(1)); // 添加相对时间
      data.push(newData); // 添加新速率数据

      // 更新图表
      myChart.setOption({
        xAxis: {
          data: timeData
        },
        series: [{
          data: data
        }]
      });
    }, 100); // 每秒钟更新一次数据

  </script>
</body>
</html>
